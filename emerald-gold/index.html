<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直播间背景板 · 翡翠金 · 透明洞版 · 右侧房源</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;display:flex;justify-content:center;align-items:center;min-height:100vh;min-height:100dvh;overflow:hidden;font-family:'Noto Sans SC',sans-serif}
.stage{width:405px;height:720px;position:relative;background:transparent;transform-origin:center center}

:root{
  --bg1:#0d2b1e; --bg2:#1a4d3a;
  --card:#0f1f18; --gold:#c9a961; --gold-bright:#e8c547; --gold-deep:#d4af37;
  --white:#ffffff; --gray:#b8c5be; --unit:#8a9a8f;
  --bottom:#0d1f16; --red:#e85d5d;
}

/* ===== 顶部通栏（下移留呼吸感） ===== */
.top-bar{position:absolute;top:0;left:0;right:0;height:124px;padding:36px 18px 4px;z-index:10;background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);border:1px solid rgba(201,168,108,.3);border-radius:6px}
.top-row{display:flex;justify-content:space-between;align-items:flex-start}
.title-block{text-align:center;flex:1}
.main-title{font-family:'Noto Serif SC',serif;font-size:28px;font-weight:900;color:var(--gold-deep);letter-spacing:5px;line-height:1.1}
.main-title-2{margin-top:2px}
.title-divider{display:inline-block;width:1px;height:13px;background:var(--gold);margin:0 8px;vertical-align:middle;opacity:.6}
.desc-line{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:5px}
.desc-line::before,.desc-line::after{content:"";width:22px;height:1px;background:var(--gold);opacity:.4}
.desc-text{font-size:10px;color:var(--gray);letter-spacing:2px}

/* ===== 中间透明洞（主播位偏左） ===== */
.hollow-zone{position:absolute;top:130px;left:0;width:251px;height:490px;background:transparent;z-index:1}
.corner{position:absolute;width:24px;height:24px;border:2px solid var(--gold);z-index:5;opacity:.6}
.corner-tl{top:138px;left:8px;border-right:none;border-bottom:none}
.corner-tr{top:138px;left:227px;border-left:none;border-bottom:none}
.corner-bl{top:596px;left:8px;border-right:none;border-top:none}
.corner-br{top:596px;left:227px;border-left:none;border-top:none}
.hollow-hint{position:absolute;top:355px;left:125px;transform:translateX(-50%);z-index:2;color:rgba(201,168,108,.3);font-size:11px;letter-spacing:3px;text-align:center;border:1px dashed rgba(201,168,108,.3);padding:14px 18px;border-radius:6px;pointer-events:none}

/* ===== 右侧房源卡片栏（不铺满，上下留白） ===== */
.right-cards{position:absolute;top:138px;right:6px;width:148px;display:flex;flex-direction:column;gap:12px;z-index:8}
.house-card{background:var(--card);border:1px solid rgba(201,168,108,.55);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;box-shadow:0 4px 16px rgba(0,0,0,.5),0 0 12px rgba(201,168,108,.15);position:relative;overflow:hidden}
.house-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold-deep) 0%,var(--gold-bright) 50%,var(--gold-deep) 100%);opacity:.85}
.card-head{display:flex;align-items:center;gap:5px;padding-bottom:4px;border-bottom:1px solid rgba(201,168,108,.2)}
.card-name{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:900;color:var(--gold-deep);letter-spacing:1px;white-space:nowrap}
.card-tag{font-size:8px;color:var(--gold-bright);border:1px solid rgba(232,197,71,.5);padding:1px 4px;border-radius:2px;margin-left:auto;background:rgba(232,197,71,.08);display:inline-block;text-align:center;line-height:1.3}
.card-price-row{display:flex;align-items:baseline;gap:3px;margin-top:3px;flex-wrap:wrap}
.price-label{font-size:10px;color:var(--unit)}
.price-num{font-family:'Noto Serif SC',serif;font-size:22px;font-weight:900;color:var(--gold-bright);line-height:1;text-shadow:0 0 8px rgba(232,197,71,.3)}
.price-unit{font-size:11px;color:var(--unit)}
.card-info{font-size:12px;color:var(--gray);margin-top:3px;letter-spacing:1px}
/* 菩提一品亮点行 */
.card-highlights{margin-top:4px;display:flex;flex-direction:column;gap:3px}
.highlight-item{font-size:10px;color:var(--gold-bright);letter-spacing:1px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;align-self:flex-start}
.highlight-dot{width:4px;height:4px;background:var(--gold);border-radius:50%;flex-shrink:0;opacity:.75}
.card-divider{height:1px;background:rgba(201,168,108,.25);margin:5px 0}

/* ===== 底部信息栏 ===== */
.bottom-bar{position:absolute;bottom:80px;left:0;right:0;height:100px;padding:12px 18px;z-index:10;background:var(--bottom);border-top:1px solid rgba(201,168,108,.25);display:flex;flex-direction:column;justify-content:center;gap:6px}
.bottom-line1{display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;color:var(--gold-bright);font-weight:700;letter-spacing:2px}
.bottom-line1 .sep{color:var(--gold);opacity:.5}
.bottom-line2{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;color:var(--white);letter-spacing:2px;font-weight:500}
.bottom-line2 .sep{color:var(--gold);opacity:.5}
.bottom-line2 .hot{color:var(--gold-bright);font-weight:700}

.export-mode .hollow-hint{display:none}
.export-mode .corner{opacity:.75}
</style>
</head>
<body>
<div class="stage">
  <!-- 顶部通栏（下移） -->
  <div class="top-bar">
    <div class="top-row">
      <div class="title-block">
        <div class="main-title">全款收房<span class="title-divider"></span>新房</div>
        <div class="main-title main-title-2">二手房优选</div>
        <div class="desc-line"><span class="desc-text">长寿本地房源 · 真实在售</span></div>
      </div>
    </div>
  </div>

  <!-- 中间透明洞 -->
  <div class="hollow-zone"></div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>
  <div class="hollow-hint">主播位置<br>（透明区）</div>

  <!-- 右侧房源卡片（不铺满） -->
  <div class="right-cards">
    <div class="house-card">
      <div class="card-head">
        <span class="card-name">凤城华府</span>
        <span class="card-tag">现房</span>
      </div>
      <div class="card-price-row">
        <span class="price-label">单价</span>
        <span class="price-num">2988</span>
        <span class="price-unit">元/㎡起</span>
      </div>
      <div class="card-info">两室三室可选</div>
      <div class="card-highlights">
        <div class="highlight-item"><span class="highlight-dot"></span>现房实景所见即所得</div>
      </div>
      <div class="card-divider"></div>
      <div class="card-head">
        <span class="card-name">菩提一品</span>
        <span class="card-tag">四代<br>住宅</span>
      </div>
      <div class="card-price-row">
        <span class="price-label">总价</span>
        <span class="price-num">50万</span>
        <span class="price-unit">左右起</span>
      </div>
      <div class="card-info">102m² - 197m²</div>
      <div class="card-highlights">
        <div class="highlight-item"><span class="highlight-dot"></span>户户空中庭院</div>
        <div class="highlight-item"><span class="highlight-dot"></span>2.0低密容积率</div>
        <div class="highlight-item"><span class="highlight-dot"></span>晶山小学+长寿中学</div>
      </div>
    </div>
  </div>

  <!-- 底部信息栏 -->
  <div class="bottom-bar">
    <div class="bottom-line1">
      <span>更多好房</span><span class="sep">·</span><span>直播间现场讲解</span><span class="sep">·</span><span>长寿真实房源</span>
    </div>
    <div class="bottom-line2">
      <span>可实地看房</span><span class="sep">·</span><span class="hot">主页有更多房源</span>
    </div>
  </div>
</div>
<script>
(function(){
  var stage=document.querySelector('.stage');
  var isExport=location.search.indexOf('export=1')>-1;
  if(isExport)document.body.classList.add('export-mode');
  function fit(){var s=Math.min(window.innerWidth/405,window.innerHeight/720);stage.style.transform='scale('+s+')';}
  fit();window.addEventListener('resize',fit);window.addEventListener('orientationchange',fit);
})();
</script>
</body>
</html>
